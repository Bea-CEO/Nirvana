name: Build
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          CI: true

      - name: Build
        run: ./gradlew build
        env:
          CI: true